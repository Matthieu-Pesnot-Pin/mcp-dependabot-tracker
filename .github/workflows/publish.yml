name: Publish to npm

# Chaque push sur master (merge de pull request compris) : build, tests, version patch
# commitée et taguée localement, publication npm par trusted publishing (OIDC), puis
# push du commit de version et du tag sur master.
# Le push du commit de version, fait avec GITHUB_TOKEN, ne relance pas ce workflow.

on:
  push:
    branches: [master]

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Install bubblewrap for the sandbox of the npm commands of Claude
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - run: npm ci
      - run: npm run build
      - run: npm test

      - name: Bump the patch version
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          npm version patch

      - run: npm publish

      - name: Push the version commit and tag
        run: git push --follow-tags
